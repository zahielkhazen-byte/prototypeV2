<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunE Talkie</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5fb;color:#211c43;font:17px system-ui}main{max-width:480px;margin:auto;padding:24px}header{font-weight:900;letter-spacing:-2px;font-size:36px}header span{color:#6445d5}section{background:white;border:1px solid #ddd9eb;border-radius:20px;padding:22px;margin-top:18px}h1{font-size:25px;margin:0 0 12px}button,select,input,a{font:inherit}button,select,input{padding:12px;border-radius:10px;border:1px solid #c6c0d8;background:white}button{cursor:pointer;font-weight:650}select{width:100%}label{display:block;margin-bottom:8px;font-weight:700}form{display:flex;gap:6px;margin:14px 0}input{min-width:0;flex:1}a{color:#5234ae}#talk{display:block;margin:24px auto;width:160px;height:160px;border-radius:50%;background:#ffda57;color:#211c43;border:6px solid #fff1b7;touch-action:none;user-select:none;-webkit-user-select:none}#talk.active{background:#fb997d}#status{text-align:center;min-height:2em}#enter{background:#6445d5;color:white}small{display:block;margin-top:15px;color:#514b65}
</style><main><header>RunE <span>Talkie</span></header>
<section id="intro"><h1>Put on your earpiece</h1><p>Connect your earpiece, then enable your microphone to join the run.</p><button id="enter">Enable audio &amp; join</button><p id="notice" role="status"></p></section>
<section id="radio" hidden><label for="rooms">Open channels</label><select id="rooms"></select><form id="create"><input id="roomName" maxlength="40" placeholder="New channel name" aria-label="New channel name" required><button>Create</button></form><a id="invite">Invite by email</a><button id="beat" hidden>Play running beat</button><button id="talk">Hold to talk</button><p id="status" role="status">Listening</p><small>Release to send. Keep this page open to hear the channel. Each turn lasts up to 12 seconds.</small></section></main>
<script>
const el=id=>document.getElementById(id), client=crypto.randomUUID();
let ctx, mic, recorder, silent, channel='', cursor=0, recording=false, chunks=[], timer, beatTimer, generation=0, nextPlay=0, playing=new Set();
async function api(path,options){const r=await fetch(path,{cache:'no-store',...options});if(!r.ok)throw Error('Connection failed');return r}
function tone(){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=210;g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.09)}
el('beat').onclick=()=>{if(beatTimer){clearInterval(beatTimer);beatTimer=null}else{tone();beatTimer=setInterval(tone,500)}el('beat').textContent=beatTimer?'Stop beat':'Play running beat'};
function choose(name,last){generation++;recording=false;clearTimeout(timer);el('talk').classList.remove('active');el('talk').textContent='Hold to talk';for(const s of playing)s.stop();playing.clear();nextPlay=0;if(beatTimer)el('beat').click();channel=name;cursor=last;el('rooms').value=name;el('beat').hidden=name!=='Music';const url=new URL(location.href);url.searchParams.set('room',name);history.replaceState(null,'',url);el('invite').href='mailto:?subject='+encodeURIComponent('Join '+name+' on RunE Talkie')+'&body='+encodeURIComponent(url.href);el('status').textContent='Listening'}
let directory={};
async function refresh(){directory=await (await api('/channels')).json();const menu=el('rooms');if(JSON.stringify([...menu.options].map(o=>o.value))!==JSON.stringify(Object.keys(directory))){menu.replaceChildren(...Object.keys(directory).map(n=>new Option(n,n)));menu.value=channel}}
el('rooms').onchange=e=>choose(e.target.value,directory[e.target.value]);
el('create').onsubmit=async e=>{e.preventDefault();const n=el('roomName').value.trim();if(!n)return;try{await api('/channels',{method:'POST',body:n});await refresh();choose(n,directory[n]);el('roomName').value=''}catch{el('status').textContent='Could not create channel. Try again.'}};
async function poll(){const version=generation;try{const data=await(await api('/listen?room='+encodeURIComponent(channel)+'&after='+cursor)).json();for(const msg of data){if(version!==generation)break;if(msg.client!==client){const raw=Uint8Array.from(atob(msg.audio),c=>c.charCodeAt(0));const pcm=new Int16Array(raw.buffer);const b=ctx.createBuffer(1,pcm.length,msg.rate);const out=b.getChannelData(0);for(let i=0;i<pcm.length;i++)out[i]=pcm[i]/32768;const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);nextPlay=Math.max(ctx.currentTime,nextPlay);s.start(nextPlay);nextPlay+=b.duration;playing.add(s);s.onended=()=>playing.delete(s)}cursor=msg.id}await refresh();if(el('status').textContent==='Reconnecting…')el('status').textContent='Listening'}catch{el('status').textContent='Reconnecting…'}setTimeout(poll,650)}
el('enter').onclick=async()=>{el('enter').disabled=true;try{ctx??=new AudioContext();await ctx.resume();const stream=await navigator.mediaDevices.getUserMedia({audio:true});mic=ctx.createMediaStreamSource(stream);recorder=ctx.createScriptProcessor(4096,1,1);silent=ctx.createGain();silent.gain.value=0;mic.connect(recorder).connect(silent).connect(ctx.destination);recorder.onaudioprocess=e=>{if(recording)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};await refresh();const n=new URL(location).searchParams.get('room');choose(Object.hasOwn(directory,n)?n:'Runners',directory[Object.hasOwn(directory,n)?n:'Runners']);el('intro').hidden=true;el('radio').hidden=false;poll()}catch{el('notice').textContent='Open the HTTPS link in Safari or Chrome, allow microphone access, and try again.';el('enter').disabled=false}};
const talk=el('talk');
function begin(){if(recording)return;ctx.resume();chunks=[];recording=true;talk.classList.add('active');talk.textContent='Release to send';el('status').textContent='Recording';timer=setTimeout(end,12000)}
async function end(){if(!recording)return;recording=false;clearTimeout(timer);talk.classList.remove('active');talk.textContent='Hold to talk';const n=chunks.reduce((sum,c)=>sum+c.length,0);if(!n){el('status').textContent='Hold a little longer';return}const pcm=new Int16Array(n);let i=0;for(const c of chunks)for(const v of c)pcm[i++]=Math.round(Math.max(-1,Math.min(1,v))*32767);const version=generation;el('status').textContent='Sending…';try{await api('/talk?'+new URLSearchParams({room:channel,rate:ctx.sampleRate,client}),{method:'POST',body:pcm.buffer});if(version===generation&&!recording)el('status').textContent='Sent · Listening'}catch{el('status').textContent='Could not send. Try again.'}}
talk.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();talk.setPointerCapture(e.pointerId);begin()};talk.onpointerup=end;talk.onlostpointercapture=end;talk.oncontextmenu=e=>e.preventDefault();talk.onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)begin()}};talk.onkeyup=e=>{if([' ','Enter'].includes(e.key))end()};
</script></html>
