<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RunE Talkie · Race radio</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header><img src="/bma.png" alt="Beirut Marathon Association"><h1>RunE Talkie</h1><p>Run Beirut. Run together.</p></header>
<section id="welcome"><h2>Put on your earpiece</h2><p id="intro">Connect your earpiece and enter a name to join the race.</p><form id="join"><label>Your name<input id="name" maxlength="32" required autocomplete="given-name"></label><button>Join with audio</button></form></section>
<section id="panel" hidden><p id="role"></p><label>Channel<select id="channel"></select></label><p id="hint"></p><button id="talk">Tap to talk</button><p id="status" role="status"></p><div id="music"></div>
<details id="share"><summary>Invite by QR code</summary><p id="qrLabel"></p><canvas id="qr" aria-label="Scan to join"></canvas></details>
<details><summary>Create a channel</summary><form id="create"><label>Private channel name<input id="newName" maxlength="60" required></label><button>Create &amp; invite</button></form></details>
<details id="controls" hidden><summary>Moderator controls</summary><form id="setMusic"><label>Spotify playlist URL<input id="playlist" type="url" placeholder="https://open.spotify.com/playlist/…" required></label><button>Save playlist</button></form><h3>Announcement speakers</h3><div id="speakers"></div></details></section>
<p id="error" role="alert"></p><footer>ENMG 664 · Race-day prototype</footer></main><script src="/qr.js"></script><script type="module" src="/app.js"></script></body></html>
